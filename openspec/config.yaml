schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: Trainer Card Pro — ficha digital para o RPG Pokémon Tabletop Adventures 2.0.
  Stack (fixa, não mudar): Next.js 15 App Router, React 19, TypeScript, TailwindCSS 3,
  Prisma 7 + SQLite (better-sqlite3), NextAuth v5. Uso: uma mesa pequena de jogadores + 1 GM.

  Programa de refatoração (foco: desempenho e boas práticas, sem trocar a stack),
  dividido em changes sequenciais:
    1. setup-quality-foundation — testes rodando, TS strict, lint, logs enxutos
    2. rebuild-authentication — login refeito do zero (o atual será descartado)
    3. secure-api-layer — autorização por dono/GM, validação e camada de serviços em todas as rotas
    4. normalize-data-model — Pokémon/itens/PC em tabelas próprias, migração do sheetData, saves granulares
    5. split-app-component — quebrar App.tsx em abas/componentes, estado local, memoização, assets
  Cada change deve deixar o app funcionando e os testes verdes ao terminar.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
